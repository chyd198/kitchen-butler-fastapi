[project]
name = "kitchen-butler-fastapi"
version = "0.1.0"
description = "AI Kitchen Butler — FastAPI backend: multimodal Kimi + Tavily search, Docker-deployable"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langchain-openai>=0.3.35",
    "langchain-tavily>=0.2.11",
    "langgraph>=0.6.11",
    "langsmith>=0.4.0",
    "pillow>=11.0",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.7.26",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
]
